name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual redeploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Cancel a running deploy when a newer commit lands on the same ref — avoids
# two workflows racing to publish different builds to the same Pages project.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. `deployments` is needed for the PR preview status.
permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: '22'
  CLOUDFLARE_PROJECT_NAME: stack-pipeline
  BUILD_OUTPUT_DIR: dist

jobs:
  build:
    name: Build & audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so `git log` based lastmod dates resolve correctly.
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Built-in dependency caching keyed on package-lock.json.
          cache: npm
          cache-dependency-path: package-lock.json

      # Cache Astro's build cache separately from node_modules. This is what makes
      # incremental content-collection builds fast once the site scales to hundreds
      # of programmatic pages.
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            .astro
            node_modules/.vite
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/content/**') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      # `npm ci` installs strictly from the lockfile — reproducible, and it fails
      # if package.json and package-lock.json have drifted apart.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Type-check Astro components
        run: npm run check
        continue-on-error: true

      - name: Build production site
        run: npm run build
        env:
          NODE_ENV: production
          # Monetization + analytics IDs are injected at build time. Configure these as
          # repository secrets; the build degrades gracefully when they are absent.
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_AUTO_ADS: ${{ vars.PUBLIC_ADSENSE_AUTO_ADS }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE_TOP: ${{ secrets.PUBLIC_ADSENSE_SLOT_IN_ARTICLE_TOP }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE_MID: ${{ secrets.PUBLIC_ADSENSE_SLOT_IN_ARTICLE_MID }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE_FOOT: ${{ secrets.PUBLIC_ADSENSE_SLOT_IN_ARTICLE_FOOT }}
          PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ secrets.PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          PUBLIC_ADSENSE_SLOT_LISTING: ${{ secrets.PUBLIC_ADSENSE_SLOT_LISTING }}
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_CONTACT_ENDPOINT: ${{ secrets.PUBLIC_CONTACT_ENDPOINT }}

      # The build script already runs the audit via `postbuild`. This step re-runs it
      # explicitly so the failure appears as its own line in the Actions summary.
      - name: Verify SEO & compliance audit
        run: npm run audit

      - name: Confirm compliance artefacts exist
        run: |
          set -euo pipefail
          required=(
            "dist/ads.txt"
            "dist/robots.txt"
            "dist/sitemap-index.xml"
            "dist/privacy-policy/index.html"
            "dist/terms-of-service/index.html"
            "dist/affiliate-disclosure/index.html"
          )
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required compliance file missing: $file"
              exit 1
            fi
            echo "✓ $file"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.BUILD_OUTPUT_DIR }}
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Never publish from a fork PR — secrets are not available there, and it would
    # otherwise attempt a deploy with empty credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ env.BUILD_OUTPUT_DIR }}

      # wrangler is the officially supported path; cloudflare/pages-action is deprecated.
      # Pushes to main publish to production; any other ref creates a preview deployment.
      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.BUILD_OUTPUT_DIR }}
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true

      - name: Summarise deployment
        run: |
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Project | \`${{ env.CLOUDFLARE_PROJECT_NAME }}\` |"
            echo "| Branch | \`${{ github.head_ref || github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.deployment-url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Preview deployed:** ${url}\n\nBuilt from \`${context.sha.slice(0, 7)}\`.`,
            });

  # Post-deploy: ping the search engines so new programmatic pages get crawled promptly.
  notify-search-engines:
    name: Ping sitemap
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Submit sitemap to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "INDEXNOW_KEY not configured — skipping."
            exit 0
          fi
          curl -fsS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"stackpipeline.com\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"https://stackpipeline.com/${INDEXNOW_KEY}.txt\",\"urlList\":[\"https://stackpipeline.com/sitemap-index.xml\"]}" \
            && echo "✓ IndexNow notified"
