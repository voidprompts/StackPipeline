name: CI

# Deployment is owned by the Cloudflare Pages Git integration, which runs
# `npm run build` and refuses to publish when it exits non-zero.
#
# This workflow exists so the same gate runs *before* merge. Without it the first
# signal of a regression is a failed production deploy: safe (the previous version
# stays live) but late and noisy. Here it surfaces as a red check on the PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs so a burst of pushes doesn't queue redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Informational: astro check surfaces type and template problems that do not
        # necessarily break the build. Kept non-blocking so a type hint never blocks a
        # content fix, while still being visible in the log.
        run: npm run check
        continue-on-error: true

      - name: Build and audit
        # `postbuild` chains scripts/audit-build.mjs automatically, so this single step
        # covers SEO, accessibility, schema validity and ad-policy compliance.
        # A non-zero exit here is exactly what Cloudflare would hit on deploy.
        run: npm run build

      - name: Verify compliance routes exist
        # Belt-and-braces: AdSense review fails without these, and a routing mistake
        # could drop one without otherwise breaking the build.
        run: |
          set -euo pipefail
          missing=0
          for f in \
            dist/index.html \
            dist/404.html \
            dist/ads.txt \
            dist/robots.txt \
            dist/sitemap-index.xml \
            dist/privacy-policy/index.html \
            dist/terms-of-service/index.html \
            dist/affiliate-disclosure/index.html \
            dist/cookie-policy/index.html \
            dist/about/index.html \
            dist/contact/index.html \
            dist/editorial-policy/index.html \
            dist/how-we-test/index.html
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All 13 compliance artefacts present."
