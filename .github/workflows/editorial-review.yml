name: Editorial review reminder

# Operationalises the 90/180/365-day review cadence published in the editorial policy.
# Runs weekly, and opens (or updates) a single tracking issue listing overdue content.
on:
  schedule:
    # 09:00 UTC every Monday.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Check review cadence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate review report
        id: report
        run: |
          node scripts/editorial-review.mjs > review-report.txt 2>&1 || true
          {
            echo 'report<<REPORT_EOF'
            cat review-report.txt
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          cat review-report.txt

      - name: Determine whether anything is overdue
        id: check
        run: |
          if node scripts/editorial-review.mjs --ci > /dev/null 2>&1; then
            echo "overdue=false" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.overdue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '📋 Content past its editorial review cadence';
            const body = [
              'The following published pages are past the review cadence declared in our',
              '[editorial policy](https://stack-pipeline.pages.dev/editorial-policy/).',
              '',
              'Re-verify live vendor pricing and product claims, then stamp each file:',
              '',
              '```bash',
              'node scripts/editorial-review.mjs --stamp src/content/<collection>/<file>.mdx',
              '```',
              '',
              '<details><summary>Full report</summary>',
              '',
              '```',
              `${{ steps.report.outputs.report }}`,
              '```',
              '',
              '</details>',
              '',
              `_Generated by the weekly review workflow on ${new Date().toISOString().slice(0, 10)}._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'editorial-review',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['editorial-review', 'content'],
              });
            }
