name: Review intake (manual)

# Manual-only entry point for the outsourced-review production pipeline. Given a path to an
# already-committed intake JSON file, this generates a draft review MDX, validates it, and opens
# a DRAFT pull request for human editorial review — see docs/review-production/WORKFLOW.md.
#
# This workflow never auto-merges anything and never requires a secret beyond the default
# GITHUB_TOKEN that every Actions run already has, so `npm run review:intake` and
# `npm run review:validate` remain fully runnable locally with no CI-only configuration.
on:
  workflow_dispatch:
    inputs:
      intake_file:
        description: 'Path (relative to repo root) to the intake JSON file to process, e.g. docs/review-production/example-intake.sample.json'
        required: true
      overwrite_existing:
        description: 'Pass --force to review:intake to overwrite an existing review for this tool'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    name: Generate and validate a draft review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm the intake file exists
        run: |
          if [ ! -f "${{ inputs.intake_file }}" ]; then
            echo "::error::Intake file not found: ${{ inputs.intake_file }}"
            exit 1
          fi

      - name: Generate draft review
        # No fallback on failure: an invalid/incomplete intake file must stop the workflow here,
        # not proceed to open a PR with a half-generated or fabricated review.
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.overwrite_existing }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          npm run review:intake -- --file "${{ inputs.intake_file }}" $FORCE_FLAG

      - name: Validate every review (including the one just generated)
        run: npm run review:validate

      - name: Type-check and build
        run: |
          npm run check
          npm run build

      - name: Upload generated draft as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-review-draft
          path: src/content/reviews/
          retention-days: 30

      - name: Open a draft pull request for human editorial review
        # actions/github-script (already vendored by GitHub Actions) rather than a third-party
        # PR-creation action, to avoid adding an external dependency to a workflow whose entire
        # point is a controlled, auditable path to publication.
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');

            const branch = `review-intake/${context.runNumber}`;
            execSync(`git config user.name "stackpipeline-bot"`);
            execSync(`git config user.email "actions@users.noreply.github.com"`);
            execSync(`git checkout -b ${branch}`);
            execSync(`git add src/content/reviews/`);

            const status = execSync('git status --porcelain').toString().trim();
            if (!status) {
              core.notice('No new or changed review files to commit — nothing to open a PR for.');
              return;
            }

            execSync(`git commit -m "Generate draft review from ${{ inputs.intake_file }} (manual workflow run #${context.runNumber})"`);
            execSync(`git push origin ${branch}`);

            const body = [
              'Automatically generated by the manual `review-intake` workflow.',
              '',
              `Source intake file: \`${{ inputs.intake_file }}\``,
              '',
              '**This PR must not be merged as-is.** It carries `draft: true` and',
              '`provenance.editorialApprovalStatus: pending`. A human editor must complete',
              '[`docs/review-production/editor-approval-checklist.md`](https://github.com/' +
                context.repo.owner + '/' + context.repo.repo +
                '/blob/main/docs/review-production/editor-approval-checklist.md)',
              'before removing `draft: true` and approving this PR.',
              '',
              '- [ ] Sources verified',
              '- [ ] Testing evidence verified',
              '- [ ] Evidence assets checked for private information',
              '- [ ] Attribution authorization confirmed',
              '- [ ] Rating integrity checked',
              '- [ ] Disclosures confirmed',
              '- [ ] `npm run review:validate` and `npm run build` re-run after edits',
            ].join('\n');

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Draft review: ${{ inputs.intake_file }} (pending editorial approval)`,
              head: branch,
              base: 'main',
              draft: true,
              body,
            });
